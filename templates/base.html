<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedAI Assistant{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <header class="bg-white border-b border-slate-100">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="{{ url_for('home') }}" class="flex items-center gap-2 font-bold text-slate-800">
                <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white text-sm">✚</span>
                MedAI Assistant
            </a>
            <nav class="flex items-center gap-4 text-sm font-medium">
                <a href="{{ url_for('home') }}" class="text-slate-600 hover:text-blue-600">New Case</a>
                <a href="{{ url_for('history') }}" class="text-slate-600 hover:text-blue-600">Dashboard</a>
                {% if session.get('authenticated') %}
                <form action="{{ url_for('logout') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="text-slate-400 hover:text-red-600">Log out</button>
                </form>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 md:py-12">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-5xl mx-auto px-4 pb-8 text-center text-xs text-slate-400">
        ⚠️ MedAI Assistant is an educational project. AI output is not medical advice and does not replace a licensed healthcare professional.
    </footer>
</body>
</html>
