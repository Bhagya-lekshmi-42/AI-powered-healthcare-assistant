{% extends "base.html" %}
{% block title %}{{ title }} · MedAI Assistant{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8 text-center">
    <div class="text-4xl mb-4">⚠️</div>
    <h1 class="text-xl font-bold mb-2">{{ title }}</h1>
    <p class="text-sm text-slate-500 mb-6">{{ message }}</p>
    <a href="{{ url_for('home') }}" class="inline-block bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-5 py-3 rounded-xl">Back to Home</a>
</div>
{% endblock %}
